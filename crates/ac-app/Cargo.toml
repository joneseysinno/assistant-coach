[package]
name = "ac-app"
description = "Assistant Coach desktop app: Studio (JoInn app-shell) and, from T18, the embedded live hub server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
app-shell.workspace = true
dioxus = { workspace = true, features = ["lib", "launch", "logger"] }
ac-domain.workspace = true
ac-sport-basketball.workspace = true
ac-store-idb.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
indexmap.workspace = true
dirs = "6"
open = "5"
tokio = { version = "1", features = ["time"] }
